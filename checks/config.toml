# Merged onto reader-ergonomics' own config, table by table; a value here wins (extending.md, the interface).
extends = "reader-ergonomics"

# The standard's three, and the answers file: it changes with every file it answers for, so it co-changes by construction.
[co_change]
exempt = ["standard.md", "llms.txt", "checks/judgments.toml", "evidence/bibliography.md"]

# The site loads the standard's own stylesheet (_standard/site.css, checked out in pages.yml), so there is none here
# to measure; reader-ergonomics extending.md asks such a repository to list none.
[readable_measure]
stylesheets = []

[sufficient_contrast]
stylesheets = []

# The headings the standard's decision-record shape requires (reader-ergonomics v1.21.0, shapes/decision-record.md).
[shape_conformance]
shapes = [
  { name = "decision record", files = ["decisions/0*.md"], required = ["Context", "Decision", "Consequences", "See also"] },
  { name = "case", files = ["cases/*/README.md"], required = ["Summary", "Genre and baseline", "The case", "Why this case", "Data and procedure", "Analysis", "Results", "Chain of evidence", "Threats to validity", "Triangulation", "Roles and ethics", "Lessons", "Method version", "Rerun", "See also"] },
]

# The principle groups of the card, in the order it shows them (standard.md).
[standard_card]
facets = ["counting", "reporting"]

# Each shape links, or holds, a filled example of itself; the cases are the examples and say so on a Shape line.
[shape_example]
files = ["shapes/*.md"]
exempt = ["shapes/README.md"]
example_headings = ["Worked example", "Example"]

# The checks of this repository, in checks/local/: case-counts, case-distinct, case-hand-counts, case-genre and
# case-analysis. Each applies to the documents whose Shape line links shapes/case.md; shape-conformance, the
# standard's, checks the headings of a case.

# Path questions are answered with their path quoted, so the quotes check stays strict.
[judgment_quotes]
optional = []

[bibliography_keys]
# A key names one work across the family (reader-ergonomics decision 0003); CI clones each name beside this repository.
family = ["reader-ergonomics",
          "reader-ergonomics-topic",
          "reader-ergonomics-blueprint",
          "reader-ergonomics-review"]
shared_links = []
